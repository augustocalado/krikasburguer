version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pedidoszap-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pedidoszap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: pedidoszap-redis
    restart: always
    ports:
      - "6379:6379"

  evolution-api:
    image: atendimenow/evolution-api:latest
    container_name: pedidoszap-evolution
    restart: always
    environment:
      - SERVER_URL=http://localhost:8080
      - API_KEY=pedidoszap-secret-key
    ports:
      - "8080:8080"
    volumes:
      - evolution_data:/evolution/instances

volumes:
  postgres_data:
  evolution_data:
